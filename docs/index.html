<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Колесо Баланса</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --tg-bg: var(--tg-theme-bg-color, #0f0f1a);
      --tg-text: var(--tg-theme-text-color, #ffffff);
      --tg-hint: var(--tg-theme-hint-color, #9999aa);
      --tg-link: var(--tg-theme-link-color, #6c8cff);
      --tg-button: var(--tg-theme-button-color, #6c8cff);
      --tg-button-text: var(--tg-theme-button-text-color, #ffffff);
      --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #1a1a2e);
      --accent1: #FF6B6B;
      --accent2: #4ECDC4;
      --accent3: #45B7D1;
      --accent4: #FFA07A;
      --accent5: #B19CD9;
      --accent6: #87CEEB;
      --accent7: #DDA0DD;
      --accent8: #90EE90;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--tg-bg);
      color: var(--tg-text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 100px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 20px 0 12px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent3), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .date {
      color: var(--tg-hint);
      font-size: 14px;
      margin-top: 4px;
    }

    /* Chart container */
    .chart-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      max-width: 500px;
      margin: 0 auto 24px;
      animation: fadeInUp 0.6s ease;
    }
    .chart-container canvas {
      animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Sliders */
    .sliders-section {
      background: var(--tg-secondary-bg);
      border-radius: 20px;
      padding: 20px 16px;
      margin-bottom: 16px;
      animation: fadeInUp 0.6s ease 0.2s both;
    }
    .sliders-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--tg-text);
    }
    .slider-item {
      margin-bottom: 18px;
      animation: slideIn 0.4s ease both;
    }
    .slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .slider-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    .slider-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .slider-value {
      font-size: 20px;
      font-weight: 700;
      min-width: 36px;
      text-align: right;
    }
    .slider-value.changing {
      animation: pulse 0.3s ease;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--tg-bg);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.2);
    }
    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Save button */
    .save-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent3), var(--accent2));
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      box-shadow: 0 4px 16px rgba(78, 205, 196, 0.3);
    }
    .save-btn:active {
      transform: scale(0.98);
    }
    .save-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .save-btn.success {
      background: linear-gradient(135deg, #4ECDC4, #44a);
    }

    /* Onboarding */
    .onboarding {
      background: var(--tg-secondary-bg);
      border-radius: 20px;
      padding: 24px 16px;
      animation: fadeInUp 0.6s ease;
    }
    .onboarding h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .onboarding p {
      color: var(--tg-hint);
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .sphere-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease both;
    }
    .sphere-input-row input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--tg-bg);
      color: var(--tg-text);
      font-size: 15px;
      font-family: inherit;
    }
    .sphere-input-row input:focus {
      outline: none;
      border-color: var(--accent3);
    }
    .sphere-input-row .remove-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: rgba(255,107,107,0.15);
      color: var(--accent1);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .add-sphere-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px dashed rgba(255,255,255,0.15);
      background: transparent;
      color: var(--tg-hint);
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .add-sphere-btn:active {
      background: rgba(255,255,255,0.05);
    }

    /* History view */
    .history-section {
      background: var(--tg-secondary-bg);
      border-radius: 20px;
      padding: 20px 16px;
      margin-bottom: 16px;
      animation: fadeInUp 0.6s ease;
    }
    .history-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .history-day {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .history-day:last-child { border-bottom: none; }
    .history-date {
      font-size: 12px;
      color: var(--tg-hint);
      margin-bottom: 4px;
    }
    .history-spheres {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .history-pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--tg-secondary-bg);
      border-radius: 14px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--tg-hint);
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
    }
    .tab.active {
      background: var(--tg-button);
      color: var(--tg-button-text);
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60vh;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent3);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      background: #333;
      color: white;
      border-radius: 12px;
      font-size: 14px;
      z-index: 1000;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translate(-50%, 20px); }
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--tg-hint);
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Загрузка...</p>
    </div>
  </div>

  <script src="/balance-wheel-app/app.js"></script>
</body>
</html>
